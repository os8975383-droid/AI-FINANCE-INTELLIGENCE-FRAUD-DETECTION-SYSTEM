services:

  api:
    build: .
    container_name: finance-api
    command:
      - python
      - -m
      - uvicorn
      - SRC.API.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"

  dashboard:
    build: .
    container_name: finance-dashboard
    command:
      - streamlit
      - run
      - APP/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - api